name: Quality and security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - name: Package Pages Functions with the verified build
        run: pnpm run build:pages-functions
      - name: Verify deployable Pages Functions artifact
        shell: bash
        run: |
          test -s .pages-functions/index.js
          test -s out/_routes.json
          test ! -e out/_worker.js
      - run: pnpm run test:all
      - name: Validate standalone Worker before any production promotion
        run: pnpm run worker:awards:types:check && pnpm run worker:awards:check
      # Temporary dev-only exception: ESLint/minimatch@3 requires brace-expansion 1.x,
      # while forcing the fixed 5.x release is API-incompatible. Remove after upstream updates.
      - run: pnpm audit --audit-level=high --ignore GHSA-mh99-v99m-4gvg
      - name: Store verified Pages build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified-release
          cp -R out verified-release/out
          cp .pages-functions/index.js verified-release/pages-functions-index.js
          printf '%s\n' "${GITHUB_SHA}" > verified-release/source-sha.txt
          sha256sum verified-release/pages-functions-index.js > verified-release/pages-functions.sha256
      - name: Upload verified release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-build-${{ github.sha }}
          path: verified-release
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
